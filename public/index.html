<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HugoPredict</title>
  <meta name="description" content="Prediction Market für Hugo SMP: Wette mit deinem Ingame-Geld auf Clan Fights, die nächste Meta und echte Ereignisse.">
  <meta name="theme-color" content="#16202b">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#app">Zum Inhalt springen</a>
  <header class="bar">
    <div class="bar-in">
      <a href="#/" class="brand" translate="no">
        <img src="/logo.png" width="40" height="40" alt="">
        HugoPredict
      </a>
      <form class="search" id="search-form" role="search">
        <input id="search" type="search" name="q" aria-label="Märkte suchen" placeholder="Märkte suchen…" autocomplete="off" spellcheck="false">
      </form>
      <nav class="nav" id="nav" aria-label="Hauptnavigation">
        <a href="#/" data-route="markets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Märkte</span></a>
        <a href="#/portfolio" data-route="portfolio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11H4zM9 8V5h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Portfolio</span></a>
        <a href="#/wallet" data-route="wallet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h16v12H3zM3 7l12-3v3m1 6h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Wallet</span></a>
        <a href="#/leaderboard" data-route="leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4m10-4h3a3 3 0 0 1-3 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Rangliste</span></a>
        <a href="#/admin" data-route="admin" class="hidden" id="nav-admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Admin</span></a>
      </nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="foot wrap">
    <p>HugoPredict ist ein Fan-Projekt für Hugo SMP. Gewettet wird nur mit Ingame-Geld.</p>
    <p id="bot-status" class="bot-status"></p>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
