<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HugoPredict</title>
  <meta name="description" content="Prediction Market für Hugo SMP: Wette mit deinem Ingame-Geld auf Clan Fights, die nächste Meta und echte Ereignisse.">
  <meta name="theme-color" content="#16202b">
  <link rel="icon" href="/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#app">Zum Inhalt springen</a>
  <header class="bar">
    <div class="bar-in">
      <a href="#/" class="brand" translate="no">
        <img src="/logo.jpg" width="40" height="40" alt="">
        HugoPredict
      </a>
      <form class="search" id="search-form" role="search">
        <input id="search" type="search" name="q" aria-label="Märkte suchen" placeholder="Märkte suchen…" autocomplete="off" spellcheck="false">
      </form>
      <nav class="nav" id="nav" aria-label="Hauptnavigation">
        <a href="#/" data-route="markets">Märkte</a>
        <a href="#/portfolio" data-route="portfolio">Portfolio</a>
        <a href="#/wallet" data-route="wallet">Wallet</a>
        <a href="#/leaderboard" data-route="leaderboard">Rangliste</a>
        <a href="#/admin" data-route="admin" class="hidden" id="nav-admin">Admin</a>
      </nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="foot wrap">
    <p>HugoPredict ist ein Fan-Projekt für Hugo SMP. Gewettet wird nur mit Ingame-Geld.</p>
    <p id="bot-status" class="bot-status"></p>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
